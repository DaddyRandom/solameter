version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: solameter-db
    environment:
      POSTGRES_DB: solameter
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: solameter_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solameter-network

  redis:
    image: redis:7-alpine
    container_name: solameter-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solameter-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solameter-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://admin:solameter_dev_2024@postgres:5432/solameter
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - solameter-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solameter-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001/ws/live
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - solameter-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  solameter-network:
    driver: bridge
